<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИЖП — Игровики Женщины Потеют</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10; --panel:#1a1a1f; --panel2:#222228; --line:#2e2e36; --text:#f2f2f5; --muted:#8b8b96;
  --blue:#5b7cff; --purple:#a64dff; --red:#ff2e3b; --sweat:#4fd1ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.logo{font-weight:900;font-size:28px;letter-spacing:-1px;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;color:transparent}
.logo small{display:block;font-size:11px;letter-spacing:.5px;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:600}
input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--blue)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 16px;font-weight:600}
button:hover{filter:brightness(1.2)}
.primary{background:linear-gradient(90deg,var(--blue),var(--purple))}
main{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:20px;padding:20px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.left{min-width:0}
.leader{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.leader h2{margin:0 0 12px;font-size:22px;font-weight:900}
.lb-wrap{overflow-x:auto}
#lb{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
#lb th{color:var(--muted);font-weight:600;font-size:12px;text-align:center;padding:8px 10px;border-bottom:1px solid var(--line)}
#lb th:nth-child(2){text-align:left}
#lb td{padding:10px;text-align:center;border-bottom:1px solid var(--line)}
#lb td.n{text-align:left;font-weight:800;cursor:pointer}
#lb td.n:hover{color:var(--purple)}
#lb tr.cur td{background:#a64dff14}
#lb td.place{font-weight:900;color:var(--muted);width:40px}
#lb tr:nth-child(2) td.place{color:#ffd54a}#lb tr:nth-child(3) td.place{color:#cfd8e3}#lb tr:nth-child(4) td.place{color:#e0a26b}
#lb td.tot{font-size:22px;font-weight:900}
#lb td.tot span{font-size:11px;color:var(--muted);font-weight:600}
#lb td.none{color:var(--muted)}
#lb .del{background:none;color:var(--muted);padding:4px 8px;font-size:14px}
#lb .del:hover{color:var(--red)}
.addrow{display:flex;gap:10px;margin-top:14px}
.addrow input{flex:1}
.addrow button{white-space:nowrap}
@media (max-width:700px){.addrow{flex-direction:column}}
.twbtn{display:inline-block;background:#9146ff;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px}
.twbtn:hover{filter:brightness(1.15)}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:1100px){aside{position:static;max-height:none}}
.card{background:var(--panel);border-radius:22px;padding:16px;border:1px solid var(--line)}
.who{font-size:13px;color:var(--muted);margin-bottom:10px}
.who b{color:var(--text);font-size:18px}
.scales{border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;
  background:linear-gradient(180deg,#1c2442,#171a2b);border:1.5px solid #4d63d9}
.scales.mult{grid-template-columns:1fr;margin-top:12px;background:linear-gradient(180deg,#2c1a3a,#1d1626);border-color:#9b4ddb}
.row-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px}
.row-h b{font-size:22px;font-weight:800}
.row-h em{font-style:normal;color:var(--muted);font-size:11px;display:block;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;padding:0;margin-top:10px;border:0;
  background:linear-gradient(90deg,var(--c) var(--p),#ffffff14 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;border:0;background:none;font-size:22px;cursor:grab;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'><path d='M12 1C12 1 2 14 2 21a10 10 0 0 0 20 0C22 14 12 1 12 1z' fill='%234fd1ff' stroke='white' stroke-width='1.5'/><ellipse cx='8' cy='20' rx='2' ry='4' fill='white' opacity='.6'/></svg>");background-size:contain;background-repeat:no-repeat}
input[type=range]::-moz-range-thumb{width:22px;height:30px;border:0;background:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'><path d='M12 1C12 1 2 14 2 21a10 10 0 0 0 20 0C22 14 12 1 12 1z' fill='%234fd1ff' stroke='white' stroke-width='1.5'/></svg>");background-size:contain;background-repeat:no-repeat}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:14px}
textarea{min-height:140px;resize:vertical}
.bottom{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.counter{margin-left:auto;background:#111;padding:8px 12px;border-radius:10px;color:var(--muted);font-size:13px}
.total{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:14px}
.total .num{font-size:120px;letter-spacing:-4px;font-weight:900;line-height:1}
.total sup{color:var(--muted);font-size:24px;font-weight:600}
aside .logo{font-size:44px;line-height:1}
[hidden]{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--purple);padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<main>
  <section class="left">
    <div class="leader">
      <h2>Таблица лидеров</h2>
      <div class="lb-wrap"><table id="lb"></table></div>
      <form class="addrow" id="addForm">
        <input id="nickInput" placeholder="Ник или ссылка на Twitch (можно несколько через запятую)">
        <button class="primary">+ Добавить стримершу</button>
      </form>
    </div>
  </section>

  <aside>
    <div class="logo">ИЖП 💦<small>ИГРОВИКИ ЖЕНЩИНЫ ПОТЕЮТ</small></div>
    <div class="card" id="pane-rate">
      <div class="who" id="who">Кликни на трансляцию, чтобы оценить</div>
      <div class="scales" id="baseScales"></div>
      <div class="scales mult" id="multScales"></div>
      <div class="fields">
        <input id="title" placeholder="Заголовок рецензии">
        <textarea id="text" maxlength="8500" placeholder="Текст рецензии (от 300 до 8500 символов)"></textarea>
      </div>
      <div class="bottom">
        <button id="clear">🧹 Очистить черновик</button>
        <span class="counter" id="counter">0/8500</span>
      </div>
      <div class="total">
        <div class="num" id="total">0</div><sup>/ 90</sup>
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
const BASE = [
  {k:'skill', n:'Скилл / Механика'},
  {k:'zavoz', n:'Завоз / Подача'},
  {k:'tilt',  n:'Тильтоустойчивость'},
  {k:'char',  n:'Харизма / Чат'},
];
const MULT = {k:'sweat', n:'Simp-фактор', hint:'множитель'};

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

// Стримерши с NASRAL / SIFU со скринов + nenormova
const SEED = ['nenormova','lota','liz0n','arina_gp','morkovushkaa','grustnica','guz3lka','charmy_games','niateppa',
  'nordvi','noodle_doodlee','missisfreedom','tetpolina','only_katya'];
let streams = load('izhp_streams', []);
if(!load('izhp_seed_v2', false)){
  SEED.slice().reverse().forEach(n=>{ if(!streams.includes(n)) streams.unshift(n) });
  save('izhp_streams', streams); save('izhp_seed_v2', true);
}
let reviews = load('izhp_reviews', {});
let current = null;
let vals = {};

const $ = id => document.getElementById(id);

function calc(v){
  const sum = BASE.reduce((s,b)=>s+(+v[b.k]||1),0);
  const m = 1 + ((+v.sweat||1)-1)*0.0675;
  return Math.min(90, Math.round(sum*1.4*m));
}

function renderLeaderboard(){
  const cols = [...BASE, MULT];
  const rows = streams.map(n=>({n, r:reviews[n]})).sort((a,b)=>(b.r?.total??-1)-(a.r?.total??-1));
  let place = 0;
  $('lb').innerHTML = `<tr><th>#</th><th>Стримерша</th>${cols.map(c=>`<th>${c.n}</th>`).join('')}<th>Итог</th><th></th><th></th></tr>` +
    rows.map(({n,r})=>`<tr class="${n===current?'cur':''}">
      <td class="place">${r ? ++place : '—'}</td>
      <td class="n" data-n="${n}">${n}</td>
      ${cols.map(c=>`<td class="${r?'':'none'}">${r ? (r.vals[c.k]||1) : '—'}</td>`).join('')}
      <td class="tot ${r?'':'none'}">${r ? r.total+'<span>/90</span>' : '—'}</td>
      <td><a class="twbtn" href="https://www.twitch.tv/${n}" target="_blank" rel="noopener">Перейти на Twitch</a></td>
      <td><button class="del" data-n="${n}" title="Убрать">✕</button></td>
    </tr>`).join('');
  $('lb').querySelectorAll('td.n').forEach(td=>td.onclick=()=>select(td.dataset.n));
  $('lb').querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    streams = streams.filter(x=>x!==b.dataset.n); save('izhp_streams', streams);
    if(current===b.dataset.n) select(streams[0]||null); else renderLeaderboard();
  });
}

function addNicks(raw){
  const nicks = raw.split(/[,\s]+/).map(x=>x.trim().toLowerCase().replace(/^.*twitch\.tv\//,'').replace(/[\/?#].*$/,'')).filter(Boolean);
  nicks.forEach(n=>{ if(!streams.includes(n)) streams.push(n) });
  save('izhp_streams', streams);
  if(!current && streams.length) select(streams[0]); else renderLeaderboard();
}

function slider(def, color, container){
  const wrap = document.createElement('div');
  const v = vals[def.k] || 1;
  wrap.innerHTML = `<div class="row-h"><span>${def.n}${def.hint?`<em>${def.hint}</em>`:''}</span><b>${v}</b></div>
    <input type="range" min="1" max="10" value="${v}" style="--c:${color}">`;
  const r = wrap.querySelector('input'), b = wrap.querySelector('b');
  const paint = () => r.style.setProperty('--p', ((r.value-1)/9*100)+'%');
  paint();
  r.oninput = () => { vals[def.k] = +r.value; b.textContent = r.value; paint(); updateTotal(); autosave(); };
  container.appendChild(wrap);
}

function renderScales(){
  $('baseScales').innerHTML=''; $('multScales').innerHTML='';
  BASE.forEach(b=>slider(b,'var(--blue)',$('baseScales')));
  slider(MULT,'var(--purple)',$('multScales'));
  updateTotal();
}

function updateTotal(){
  $('total').textContent = calc(vals);
  const len = $('text').value.length;
  $('counter').textContent = `${len}/8500`;
  
}

function select(nick){
  current = nick;
  const r = nick && reviews[nick];
  vals = r ? {...r.vals} : {};
  $('title').value = r ? r.title : '';
  $('text').value = r ? r.text : '';
  $('who').innerHTML = nick ? `Рецензия на: <b>${nick}</b>` : 'Выбери стримершу в таблице';
  renderScales(); renderLeaderboard();
}

// автосейв: любое изменение сразу пишется в localStorage
function autosave(){
  if(!current) return;
  reviews[current] = {vals:{...vals}, title:$('title').value, text:$('text').value, total:calc(vals)};
  save('izhp_reviews', reviews);
  renderLeaderboard();
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

$('addForm').onsubmit = e => { e.preventDefault(); addNicks($('nickInput').value); $('nickInput').value=''; };
$('title').oninput = autosave;
$('text').oninput = () => { updateTotal(); autosave(); };
$('clear').onclick = () => { vals={}; $('title').value=''; $('text').value=''; renderScales(); if(current){ delete reviews[current]; save('izhp_reviews',reviews); renderLeaderboard(); } };

renderScales();
select(streams[0] || null);
</script>
</body>
</html>
