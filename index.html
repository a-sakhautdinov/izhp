<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИЖП — Игровики Женщины Потеют</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10; --panel:#1a1a1f; --panel2:#222228; --line:#2e2e36; --text:#f2f2f5; --muted:#8b8b96;
  --blue:#5b7cff; --purple:#a64dff; --red:#ff2e3b; --sweat:#4fd1ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.logo{font-weight:900;font-size:28px;letter-spacing:-1px;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;color:transparent}
.logo small{display:block;font-size:11px;letter-spacing:.5px;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:600}
input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--blue)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 16px;font-weight:600}
button:hover{filter:brightness(1.2)}
.primary{background:linear-gradient(90deg,var(--blue),var(--purple))}
main{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:20px;padding:20px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.left{min-width:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:row dense;gap:12px;align-content:start}
.tile.active{grid-column:span 3;order:-2}
.chattile{order:-1;grid-column:span 1;border-radius:14px;overflow:hidden;background:#18181b;min-height:300px}
.chattile iframe{width:100%;height:100%;border:0;display:block}
.addtile{order:99999}
.pl,.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#ffffff22}
.tile:not(.active) .frame .pl{pointer-events:none}
.tile .tw{display:none;font-size:13px;color:var(--muted);margin-left:8px}
.tile.active .tw{display:inline}
.tile.active .nick{font-size:20px}
@media (max-width:1500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile.active{grid-column:1/-1}.chattile{grid-column:1/-1;height:360px;min-height:0}}
@media (max-width:700px){.grid{grid-template-columns:1fr}.chattile{display:none}}
.tile{background:var(--panel);border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:.15s}
.addtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);background:none;min-height:160px;color:var(--muted);padding:14px}
.addtile:hover{border-color:var(--purple);color:var(--text)}
.addtile .plus{font-size:48px;font-weight:300;line-height:1}
.addtile form{display:flex;flex-direction:column;gap:8px;width:100%}
.addtile input{padding:10px 12px}
.tile.active{border-color:var(--purple);box-shadow:0 0 0 4px #a64dff33}
.frame{position:relative;aspect-ratio:16/9;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.live{position:absolute;top:8px;left:8px;font-size:11px!important;background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:6px;z-index:2;pointer-events:none}
.meta{display:flex;align-items:center;gap:10px;padding:10px 12px}
.nick{font-weight:800}
.score-badge{margin-left:auto;font-weight:900;font-size:18px}
.score-badge span{font-size:11px;color:var(--muted)}
.x{background:none;color:var(--muted);padding:4px 8px}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:1100px){aside{position:static;max-height:none}}
.warn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:15px;line-height:1.5}
.warn code{color:var(--text);background:#ffffff14;padding:2px 6px;border-radius:6px}
.card{background:var(--panel);border-radius:22px;padding:16px;border:1px solid var(--line)}
.who{font-size:13px;color:var(--muted);margin-bottom:10px}
.who b{color:var(--text);font-size:18px}
.scales{border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;
  background:linear-gradient(180deg,#1c2442,#171a2b);border:1.5px solid #4d63d9}
.scales.mult{grid-template-columns:1fr;margin-top:12px;background:linear-gradient(180deg,#2c1a3a,#1d1626);border-color:#9b4ddb}
.row-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px}
.row-h b{font-size:22px;font-weight:800}
.row-h em{font-style:normal;color:var(--muted);font-size:11px;display:block;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;padding:0;margin-top:10px;border:0;
  background:linear-gradient(90deg,var(--c) var(--p),#ffffff14 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;border:0;background:none;font-size:22px;cursor:grab;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'><path d='M12 1C12 1 2 14 2 21a10 10 0 0 0 20 0C22 14 12 1 12 1z' fill='%234fd1ff' stroke='white' stroke-width='1.5'/><ellipse cx='8' cy='20' rx='2' ry='4' fill='white' opacity='.6'/></svg>");background-size:contain;background-repeat:no-repeat}
input[type=range]::-moz-range-thumb{width:22px;height:30px;border:0;background:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'><path d='M12 1C12 1 2 14 2 21a10 10 0 0 0 20 0C22 14 12 1 12 1z' fill='%234fd1ff' stroke='white' stroke-width='1.5'/></svg>");background-size:contain;background-repeat:no-repeat}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:14px}
textarea{min-height:140px;resize:vertical}
.bottom{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.counter{margin-left:auto;background:#111;padding:8px 12px;border-radius:10px;color:var(--muted);font-size:13px}
.total{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:14px}
.total .num{font-size:120px;letter-spacing:-4px;font-weight:900;line-height:1}
.total sup{color:var(--muted);font-size:24px;font-weight:600}
.live.off{background:#444}
aside .logo{font-size:44px;line-height:1}
[hidden]{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--purple);padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<main>
  <section class="left">
    <div class="grid" id="grid"></div>
  </section>

  <aside>
    <div class="logo">ИЖП 💦<small>ИГРОВИКИ ЖЕНЩИНЫ ПОТЕЮТ</small></div>
    <div class="card" id="pane-rate">
      <div class="who" id="who">Кликни на трансляцию, чтобы оценить</div>
      <div class="scales" id="baseScales"></div>
      <div class="scales mult" id="multScales"></div>
      <div class="fields">
        <input id="title" placeholder="Заголовок рецензии">
        <textarea id="text" maxlength="8500" placeholder="Текст рецензии (от 300 до 8500 символов)"></textarea>
      </div>
      <div class="bottom">
        <button id="clear">🧹 Очистить черновик</button>
        <span class="counter" id="counter">0/8500</span>
      </div>
      <div class="total">
        <div class="num" id="total">0</div><sup>/ 90</sup>
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
const BASE = [
  {k:'skill', n:'Скилл / Механика'},
  {k:'zavoz', n:'Завоз / Подача'},
  {k:'tilt',  n:'Тильтоустойчивость'},
  {k:'char',  n:'Харизма / Чат'},
];
const MULT = {k:'sweat', n:'Simp-фактор', hint:'множитель'};

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

// Стримерши с NASRAL / SIFU со скринов + nenormova
const SEED = ['nenormova','lota','liz0n','arina_gp','morkovushkaa','grustnica','guz3lka','charmy_games','niateppa',
  'nordvi','noodle_doodlee','missisfreedom','tetpolina','only_katya'];
let streams = load('izhp_streams', []);
if(!load('izhp_seed_v2', false)){
  SEED.slice().reverse().forEach(n=>{ if(!streams.includes(n)) streams.unshift(n) });
  save('izhp_streams', streams); save('izhp_seed_v2', true);
}
let reviews = load('izhp_reviews', {});
let current = null;
let vals = {};

const $ = id => document.getElementById(id);
const parent = location.hostname || 'localhost';

function calc(v){
  const sum = BASE.reduce((s,b)=>s+(+v[b.k]||1),0);
  const m = 1 + ((+v.sweat||1)-1)*0.0675;
  return Math.min(90, Math.round(sum*1.4*m));
}

const tiles = {};      // nick -> {el, player}
let chatTile = null;
const canEmbed = () => location.protocol!=='file:' && !!window.Twitch;

// Плитки создаются один раз; при клике меняется только CSS-класс, плееры не перезагружаются
function renderGrid(){
  const g = $('grid');
  if(!chatTile){
    chatTile = document.createElement('div');
    chatTile.className = 'chattile';
    chatTile.innerHTML = '<iframe title="Чат Twitch"></iframe>';
    g.appendChild(chatTile);
    g.appendChild(addTile());
  }
  Object.keys(tiles).forEach(n=>{ if(!streams.includes(n)){ tiles[n].el.remove(); delete tiles[n]; } });
  streams.forEach(nick=>{ if(!tiles[nick]) createTile(nick); });
  Object.entries(tiles).forEach(([n,t])=>{
    t.el.classList.toggle('active', n===current);
    t.el.style.order = n===current ? -2 : streams.indexOf(n);
    updateBadge(n);
  });
  chatTile.style.display = current ? '' : 'none';
}

function createTile(nick){
  const t = document.createElement('div');
  t.className = 'tile';
  const id = 'p_'+nick.replace(/[^a-z0-9_]/g,'_');
  t.innerHTML = `
    <div class="frame">
      <div class="ph">ИЖП</div>
      <div class="live off">ЗАГРУЗКА</div>
      <div class="pl" id="${id}"></div>
    </div>
    <div class="meta">
      <span class="nick">${nick}</span><a class="tw" href="https://www.twitch.tv/${nick}" target="_blank" rel="noopener">Открыть на Twitch ↗</a>
      <span class="score-badge"></span>
      <button class="x" title="Убрать">✕</button>
    </div>`;
  t.onclick = e => {
    if(e.target.closest('.tw')) return;
    if(e.target.classList.contains('x')){
      streams = streams.filter(s=>s!==nick); save('izhp_streams',streams);
      if(current===nick) select(streams[0]||null); else renderGrid();
      return;
    }
    if(current!==nick) select(nick);
  };
  $('grid').appendChild(t);
  const entry = tiles[nick] = {el:t, player:null};
  const badge = t.querySelector('.live');
  if(location.protocol==='file:'){
    badge.remove();
    t.querySelector('.ph').innerHTML = '<div class="warn"><div>Плеер работает только с сервера.<br><code>python3 -m http.server</code></div></div>';
    return;
  }
  if(!window.Twitch){ badge.textContent='ПЛЕЕР НЕ ЗАГРУЗИЛСЯ'; return; }
  const p = entry.player = new Twitch.Player(id, {channel:nick, parent:[parent], width:'100%', height:'100%', muted:true, autoplay:true});
  const setLive = on => { badge.textContent = on ? 'В ЭФИРЕ' : 'ОФЛАЙН'; badge.classList.toggle('off', !on); };
  p.addEventListener(Twitch.Player.ONLINE, ()=>setLive(true));
  p.addEventListener(Twitch.Player.PLAYING, ()=>{ setLive(true); applyQuality(nick); });
  p.addEventListener(Twitch.Player.OFFLINE, ()=>setLive(false));
}

// маленькие плитки — низкое качество, большая — лучшее
function applyQuality(nick){
  const p = tiles[nick]?.player; if(!p) return;
  try{
    const q = (p.getQualities()||[]).map(x=>x.group||x.name).filter(x=>x && x!=='auto');
    if(!q.length) return;
    p.setQuality(nick===current ? q[0] : q[q.length-1]);
  }catch(e){}
}

function updateBadge(nick){
  const t = tiles[nick]; if(!t) return;
  const r = reviews[nick];
  t.el.querySelector('.score-badge').innerHTML = r ? r.total+'<span>/90</span>' : '<span>не оценена</span>';
}

function addTile(){
  const a = document.createElement('div');
  a.className = 'tile addtile';
  const reset = () => { a.innerHTML = '<div class="plus">+</div><div>Добавить стримершу</div>'; };
  reset();
  a.onclick = () => {
    if(a.querySelector('form')) return;
    a.innerHTML = `<form><input placeholder="Ник или ссылка на Twitch">
      <button class="primary">Добавить</button></form>`;
    const f = a.querySelector('form'), i = f.querySelector('input');
    i.focus();
    i.onkeydown = e => { if(e.key==='Escape'){ e.stopPropagation(); reset(); } };
    f.onsubmit = e => {
      e.preventDefault();
      const nicks = i.value.split(/[,\s]+/).map(s=>s.trim().toLowerCase().replace(/^.*twitch\.tv\//,'').replace(/[\/?#].*$/,'')).filter(Boolean);
      nicks.forEach(n=>{ if(!streams.includes(n)) streams.push(n) });
      save('izhp_streams',streams);
      setTimeout(reset);
      if(!current && streams.length) select(streams[0]); else renderGrid();
    };
  };
  return a;
}

function slider(def, color, container){
  const wrap = document.createElement('div');
  const v = vals[def.k] || 1;
  wrap.innerHTML = `<div class="row-h"><span>${def.n}${def.hint?`<em>${def.hint}</em>`:''}</span><b>${v}</b></div>
    <input type="range" min="1" max="10" value="${v}" style="--c:${color}">`;
  const r = wrap.querySelector('input'), b = wrap.querySelector('b');
  const paint = () => r.style.setProperty('--p', ((r.value-1)/9*100)+'%');
  paint();
  r.oninput = () => { vals[def.k] = +r.value; b.textContent = r.value; paint(); updateTotal(); autosave(); };
  container.appendChild(wrap);
}

function renderScales(){
  $('baseScales').innerHTML=''; $('multScales').innerHTML='';
  BASE.forEach(b=>slider(b,'var(--blue)',$('baseScales')));
  slider(MULT,'var(--purple)',$('multScales'));
  updateTotal();
}

function updateTotal(){
  $('total').textContent = calc(vals);
  const len = $('text').value.length;
  $('counter').textContent = `${len}/8500`;
  
}

function select(nick){
  const prev = current;
  current = nick;
  const r = nick && reviews[nick];
  vals = r ? {...r.vals} : {};
  $('title').value = r ? r.title : '';
  $('text').value = r ? r.text : '';
  $('who').innerHTML = nick ? `Рецензия на: <b>${nick}</b>` : 'Кликни на стримершу, чтобы оценить';
  renderScales(); renderGrid();
  if(prev && tiles[prev]?.player){ try{ tiles[prev].player.setMuted(true) }catch(e){} applyQuality(prev); }
  if(nick && tiles[nick]?.player){ try{ tiles[nick].player.setMuted(false) }catch(e){} applyQuality(nick); }
  if(nick && location.protocol!=='file:') chatTile.querySelector('iframe').src = `https://www.twitch.tv/embed/${encodeURIComponent(nick)}/chat?parent=${parent}&darkpopout`;
}

// автосейв: любое изменение сразу пишется в localStorage
function autosave(){
  if(!current) return;
  reviews[current] = {vals:{...vals}, title:$('title').value, text:$('text').value, total:calc(vals)};
  save('izhp_reviews', reviews);
  updateBadge(current);
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

$('title').oninput = autosave;
$('text').oninput = () => { updateTotal(); autosave(); };
$('clear').onclick = () => { vals={}; $('title').value=''; $('text').value=''; renderScales(); if(current){ delete reviews[current]; save('izhp_reviews',reviews); updateBadge(current); } };

renderScales();
select(streams[0] || null);
</script>
</body>
</html>
